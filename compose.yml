---
services:
  db:
    image: barath1055/library-repo:dbimage
    ports:
      - "3306:3306"
    deploy:
      replicas: 1
  auth-service:
    image: barath1055/library-repo:auth
    ports:
      - "5001:5001"
    deploy:
      replicas: 1
    depends_on:
      - db
  book-service:
    image: barath1055/library-repo:book
    ports:
      - "5002:5002"
    deploy:
      replicas: 1
    depends_on:
      - db
  borrow-service:
    image: barath1055/library-repo:borrow
    ports:
      - "5003:5003"
    deploy:
      replicas: 1
    depends_on:
      - db
  app-service:
    image: barath1055/library-repo:app
    ports:
      - "5000:5000"
    deploy:
      replicas: 1
    depends_on:
      - auth-service
      - book-service
      - borrow-service
